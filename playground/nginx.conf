# Dev-only playground: serves the UI and proxies everything under one origin (no CORS needed).
events {}

http {
  include /etc/nginx/mime.types;

  server {
    listen 80;
    root /srv/playground;

    location = / {
      try_files /index.html =404;
      add_header Cache-Control "no-store";
    }

    location = /clients.json {
      alias /srv/scripts/dev-clients.json;
      add_header Cache-Control "no-store";
    }

    location /api/ {
      proxy_pass http://app:3410/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # Server-Sent Events: stream immediately, keep long-lived connections open.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /idp/ {
      proxy_pass http://dev-idp:3412/;
    }

    location /treasury/ {
      proxy_pass http://treasury-sim:3417/;
    }

    # Nothing else in the mounted folder is served.
    location / {
      return 404;
    }
  }
}
